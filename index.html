<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="keywords" content="IMC Gallery">
        <meta name="description" content="Gallery for SMAS Al Izzah IMC">
        <meta name="author" content="Aisya Zihni Mumtaza">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>IMC Gallery</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body>  
        <nav class="navbar">
            <h1 class="navbar-title">IMC Gallery</h1>
            <div class="search-bar-container">
                <input id="search-bar" type="text" placeholder="Search" aria-label="Search file">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <button id="settings-btn" type="button" aria-label="Open settings">
                <i class="fa-solid fa-gear"></i>
            </button>
            <button id="profile-btn" type="button" aria-label="View profile">
                <i class="fa-solid fa-circle-user"></i>
            </button>
            <button id="toggle-sidebar-btn" aria-label="Toggle sidebar">
                <i class="fa-solid fa-arrows-left-right"></i>
            </button>
        </nav>
        <div class="main-container">
            <aside class="sidebar">
                <ul class="sidebar-menu">
                    <li>
                        <a href="#">
                            <i class="fa-solid fa-house"></i>
                            Home
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="fa-solid fa-image"></i> 
                            Photo
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="fa-solid fa-film"></i>
                            Video
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="fa-solid fa-photo-film"></i> 
                            Album
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="fa-solid fa-users-viewfinder"></i> 
                            People
                        </a>
                    </li>
                </ul>
            </aside>
        </div>
    </body>
